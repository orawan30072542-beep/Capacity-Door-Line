<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haier Door Line - Supabase Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0B1329',
                        cardbg: '#131E3E',
                        bordercolor: '#1E293B',
                        haierblue: '#0066FF',
                        haiercyan: '#00F0FF',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .chart-container-wrapper { position: relative; width: 100%; height: 320px; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-[#070D1F] border-r border-bordercolor hidden md:flex flex-col justify-between">
            <div>
                <div class="p-6 border-b border-bordercolor flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <div>
                        <h2 class="font-bold text-base tracking-wide text-white">HAIER</h2>
                        <p class="text-xs text-cyan-400 font-medium">Smart Door Line</p>
                    </div>
                </div>
                <nav class="p-4 space-y-2">
                    <a href="#plan-order" class="block px-4 py-3 rounded-xl bg-blue-600/20 border border-blue-500/30 text-blue-400 font-medium transition flex items-center space-x-3">
                        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
                        <span>2. Order รายวันและ UPH (Supabase)</span>
                    </a>
                </nav>
            </div>
            <div class="p-4 mx-4 mb-4 bg-slate-900/50 rounded-xl border border-bordercolor text-xs text-slate-400 flex items-center justify-between">
                <span>Supabase Status</span>
                <span id="dbStatus" class="flex items-center space-x-1.5 text-amber-400 font-medium">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span>Connecting...</span>
                </span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-y-auto">
            
            <header class="bg-cardbg/80 backdrop-blur-md border-b border-bordercolor px-6 py-4 flex justify-between items-center sticky top-0 z-20">
                <h1 class="text-base sm:text-lg font-bold text-white">Haier Manufacturing Intelligence (Supabase Integrated)</h1>
                <div class="flex items-center space-x-2 bg-slate-900/60 p-2 rounded-xl border border-bordercolor">
                    <span class="text-xs text-slate-400">ชั่วโมงทำงาน:</span>
                    <input type="number" id="shiftHoursInput" value="8" min="1" max="24" step="0.5" class="bg-slate-800 text-cyan-400 text-xs px-3 py-1.5 w-16 text-center rounded border border-bordercolor focus:outline-none">
                    <button onclick="renderDashboard()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">คำนวณใหม่</button>
                </div>
            </header>

            <div class="p-6 space-y-6">
                <!-- 2. ORDER รายวันและ UPH -->
                <section id="plan-order" class="bg-cardbg p-6 rounded-2xl border border-bordercolor space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-1.5 h-6 bg-cyan-400 rounded-full"></div>
                            <h2 class="text-lg font-bold text-white">2. ตารางสรุปแผนการผลิต (ดึงข้อมูลจาก Supabase)</h2>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="fetchDataFromSupabase()" class="bg-slate-800 hover:bg-slate-700 text-cyan-400 text-xs font-semibold px-3.5 py-2.5 rounded-xl border border-bordercolor transition">
                                โหลดข้อมูลจาก Supabase
                            </button>
                            <button onclick="saveExcelToSupabase()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-lg transition">
                                อัปโหลด Excel ขึ้น Supabase
                            </button>
                            <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                        <div class="lg:col-span-5 bg-slate-900/40 p-4 rounded-xl border border-bordercolor">
                            <div class="chart-container-wrapper">
                                <canvas id="planChart"></canvas>
                            </div>
                        </div>
                        <div class="lg:col-span-7 bg-slate-900/60 p-4 rounded-xl border border-bordercolor">
                            <div class="max-h-[350px] overflow-y-auto overflow-x-auto relative rounded-lg border border-bordercolor/50">
                                <table id="tablePlanOrder" class="w-full text-left border-collapse text-xs">
                                    <thead><tr class="border-b border-bordercolor text-slate-400"></tr></thead>
                                    <tbody class="divide-y divide-bordercolor/50 text-slate-300"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Script เชื่อมต่อและประมวลผล -->
    <script>
        // กำหนดค่า Supabase Project ของคุณที่นี่
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let globalData = { days: [], groups: [] };
        let planChart = null;

        async function checkConnection() {
            const statusEl = document.getElementById('dbStatus');
            try {
                const { data, error } = await _supabase.from('production_plans').select('*').limit(1);
                if (error) throw error;
                statusEl.className = 'flex items-center space-x-1.5 text-emerald-400 font-medium';
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span><span>Connected</span>';
                fetchDataFromSupabase();
            } catch (err) {
                statusEl.className = 'flex items-center space-x-1.5 text-rose-400 font-medium';
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Connection Failed</span>';
                console.error("Supabase connection error:", err.message);
            }
        }

        // ดึงข้อมูลจาก Supabase มาแปลงเป็นโครงสร้างตาราง
        async function fetchDataFromSupabase() {
            try {
                const { data, error } = await _supabase.from('production_plans').select('*');
                if (error) throw error;

                if (data && data.length > 0) {
                    // จัดกลุ่มข้อมูลตาม Product Group และ Model
                    let daysSet = new Set();
                    let groupMap = {};

                    data.forEach(row => {
                        let g = row.product_group || 'General';
                        let m = row.model_name || 'Standard';
                        let d = row.plan_date;
                        let qty = row.order_qty || 0;

                        daysSet.add(d);
                        if (!groupMap[g]) groupMap[g] = {};
                        if (!groupMap[g][m]) groupMap[g][m] = {};
                        groupMap[g][m][d] = qty;
                    });

                    let days = Array.from(daysSet).sort();
                    let groups = [];

                    for (let gName in groupMap) {
                        let models = [];
                        for (let mName in groupMap[gName]) {
                            let orders = days.map(d => groupMap[gName][mName][d] || 0);
                            models.initializeAppObject ? '' : models.push({ name: mName, orders: orders });
                        }
                        groups.push({ productGroup: gName, models: models });
                    }

                    globalData = { days, groups };
                    renderDashboard();
                }
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function calculateTotals(groups, days) {
            let totalOutputs = new Array(days.length).fill(0);
            groups.forEach(g => {
                g.models.forEach(m => {
                    for (let i = 0; i < days.length; i++) {
                        totalOutputs[i] += Number(m.orders[i]) || 0;
                    }
                });
            });
            return { totalOutputs };
        }

        function renderDashboard() {
            if (!globalData.days.length) return;
            const tableElement = document.getElementById('tablePlanOrder');
            const headerRow = tableElement.querySelector('thead tr');
            const tbody = tableElement.querySelector('tbody');

            headerRow.innerHTML = '';
            tbody.innerHTML = '';

            let days = globalData.days;
            let groups = globalData.groups;
            let hours = parseFloat(document.getElementById('shiftHoursInput').value) || 8;

            let headerHtml = `<th class="p-3 font-medium w-28 text-slate-300 bg-slate-900 sticky top-0 z-30">Group</th><th class="p-3 font-medium w-32 text-slate-300 bg-slate-900 sticky top-0 z-30">Model</th>`;
            days.forEach(d => headerHtml += `<th class="p-3 font-medium text-center text-slate-300 bg-slate-900 sticky top-0 z-30">${d}</th>`);
            headerRow.innerHTML = headerHtml;

            let calc = calculateTotals(groups, days);

            // แถว Total
            let totalTr = document.createElement('tr');
            totalTr.className = 'bg-blue-950/95 font-bold text-cyan-300 sticky top-[41px] z-20 border-b-2 border-bordercolor';
            let totalHtml = `<td class="p-3">TOTAL</td><td class="p-3">Output / UPH</td>`;
            for (let i = 0; i < days.length; i++) {
                let dayTot = calc.totalOutputs[i];
                let uph = hours > 0 ? Math.round(dayTot / hours) : 0;
                totalHtml += `<td class="p-2 text-center border-l border-bordercolor/40"><div class="text-amber-400">${dayTot.toLocaleString()}</div><div class="text-white text-[10px]">${uph.toLocaleString()}</div></td>`;
            }
            totalTr.innerHTML = totalHtml;
            tbody.appendChild(totalTr);

            groups.forEach(g => {
                g.models.forEach((m, idx) => {
                    let tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/30 border-b border-bordercolor/40';
                    let html = '';
                    if (idx === 0) html += `<td class="p-3 font-semibold text-white bg-slate-900/60" rowspan="${g.models.length}">${g.productGroup}</td>`;
                    html += `<td class="p-3 text-slate-200">${m.name}</td>`;
                    for (let i = 0; i < days.length; i++) {
                        let val = m.orders[i] || 0;
                        let uphM = val > 0 && hours > 0 ? Math.round(val / hours) : '-';
                        html += `<td class="p-2 text-center border-l border-bordercolor/30"><div class="text-cyan-400">${val > 0 ? val.toLocaleString() : '-'}</div><div class="text-white text-[10px]">${uphM}</div></td>`;
                    }
                    tr.innerHTML = html;
                    tbody.appendChild(tr);
                });
            });

            // อัปเดตกราฟ
            const ctx = document.getElementById('planChart').getContext('2d');
            if (planChart) planChart.destroy();
            planChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{ label: 'Total Order', data: calc.totalOutputs, backgroundColor: '#00F0FF', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        // เริ่มต้นตรวจสอบการเชื่อมต่อ Supabase เมื่อเปิดหน้าเว็บ
        window.onload = checkConnection;
    </script>
</body>
</html>
